<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · HJaaS</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
  /* Reference build by Wren. Every URL is absolute: this page is served at any missing path. */
  @font-face { font-family: 'Instrument Sans'; src: url('/assets/404/instrument-sans.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }
  html, body { margin: 0; height: 100%; background: #F6F3EC; color: #111; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         /* the text's top is 18px below the boots: the art ends 24 canvas px below them */
         --art: min(100vw, 1100px); gap: calc(18px - var(--art) * 24 / 1672);
         font-family: 'Instrument Sans', system-ui, sans-serif; }
  svg { display: block; width: var(--art); height: auto; aspect-ratio: 1672 / 854; }
  /* the phone viewBox's shape, held from the first paint so nothing shifts when 404.json arrives */
  @media (max-aspect-ratio: 1/1) { body { gap: calc(18px - var(--art) * 24 / 1384); } svg { aspect-ratio: 1384 / 854; } }
  .gone { visibility: hidden; }
  p { margin: 0 0 2rem; font-size: 1.0625rem; text-align: center; }
  /* as much below the text as the art leaves above the numeral, so what is seen is centred (a phone's 2rem is that already) */
  @media (min-aspect-ratio: 1/1) and (min-height: 700px) { p { margin-bottom: calc(var(--art) * 110.8 / 1672); } }
  a { color: inherit; text-underline-offset: .2em; display: inline-block; }
</style>
</head>
<body>
<main>
  <svg id="art" viewBox="0 0 1672 854" role="img" aria-label="404: Rachel sketching at her drafting table">
    <path id="numeral" fill="#000"/>
    <g id="rachel" class="gone">
      <image id="figure" href="/assets/404/figure.webp"/>
      <g id="arms"></g>
      <image id="blink" class="gone" href="/assets/404/blink.webp"/>
    </g>
  </svg>
</main>
<p>This page is still on the drawing board. <a href="/">Back to the main site!</a></p>
<script>
(async () => {
  const base = '/assets/404/';
  const [m, r] = await Promise.all([fetch(base + '404.json').then(x => x.json()), fetch(base + 'routine.json').then(x => x.json())]);
  const svg = document.getElementById('art');
  const place = (el, o) => { for (const k of ['x', 'y', 'width', 'height']) el.setAttribute(k, o[k === 'width' ? 'w' : k === 'height' ? 'h' : k]); };
  document.getElementById('numeral').setAttribute('d', m.numeral.d);
  place(document.getElementById('figure'), m.figure);
  const blink = document.getElementById('blink'); place(blink, m.blink);
  const arms = {};
  for (const [name, src] of Object.entries(m.arm.frames)) {
    const im = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    im.setAttribute('href', base + src); place(im, m.arm);
    if (name !== m.arm.rest) im.classList.add('gone');
    document.getElementById('arms').append(im); arms[name] = im;
  }
  const phone = matchMedia('(max-aspect-ratio: 1/1)');
  // the empty page under the boots and the numeral (its bbox ends at 830.2) is cropped to 24px: the height is in the CSS too
  const height = Math.round(m.numeral.bbox[3] + 24);
  const fit = () => { const [x, y, w] = phone.matches ? m.phone_viewbox : [0, 0, m.canvas.w]; svg.setAttribute('viewBox', [x, y, w, height].join(' ')); };
  fit(); phone.addEventListener('change', fit);
  const ready = src => { const i = new Image(); i.src = base + src; return i.decode().catch(() => {}); };
  // she appears placed and whole: never unplaced, and never with the hole where her arm goes
  await Promise.all([m.figure.src, m.arm.frames[m.arm.rest]].map(ready));
  document.getElementById('rachel').classList.remove('gone');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  // wait until every frame is decoded, so no swap ever shows a blank
  await Promise.all(Object.values(m.arm.frames).concat(m.blink.src, m.figure.src).map(ready));
  let cur = m.arm.rest;
  const show = n => { if (n !== cur) { arms[n].classList.remove('gone'); arms[cur].classList.add('gone'); cur = n; } };
  const wait = ms => new Promise(res => setTimeout(res, ms));
  for (;;) {
    for (const s of r.steps) {
      if (document.hidden) { await wait(500); continue; }
      show(s.arm);
      if (s.blink) {
        const pre = (s.ms - r.blink_ms) / 2;
        await wait(pre); blink.classList.remove('gone'); await wait(r.blink_ms); blink.classList.add('gone'); await wait(s.ms - pre - r.blink_ms);
      } else await wait(s.ms);
    }
  }
})();
</script>
</body>
</html>
