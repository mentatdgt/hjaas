<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HJaaS</title>
    <!-- TODO(copy): the real description. Used by search results and link previews (og:description). -->
    <meta name="description" content="TODO(copy): Hui Jie at work. Find the 50 mushrooms hidden in her five scenes to get in touch." />
    <meta name="theme-color" content="#f6f3ec" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HJaaS" />
    <!-- TODO(copy): same text as the description above. -->
    <meta property="og:description" content="TODO(copy): Hui Jie at work. Find the 50 mushrooms hidden in her five scenes to get in touch." />
    <!-- TODO(launch): link previews need an absolute URL; put the live domain in front of this path. -->
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The HJaaS tape-measure logo" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <!-- The opening scene's plate is the first thing the page needs: it is fetched while the script is still
         downloading. Matches loadPlate()'s request. -->
    <script src="./room-route.js"></script>
    <script>
      (function () {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.type = 'image/webp';
        link.setAttribute('fetchpriority', 'high');
        link.href = './assets/' + window.hjaasRoom(location.hash).folder + '/room.webp';
        document.head.appendChild(link);
      })();
    </script>
    <style>
      /* A paper page. The scene is as tall as its content, so the page scrolls when it has to. */
      html, body { margin: 0; background: #f6f3ec; }
      html { scrollbar-color: #bdb6a6 #f6f3ec; }
      #site { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
    </style>
  </head>
  <body>
    <main id="site"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
