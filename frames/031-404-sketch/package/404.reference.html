<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · HJaaS</title>
<link rel="icon" href="/favicon-32.png">
<style>
  /* Reference build by Wren. Every URL is absolute: this page is served at any missing path. */
  @font-face { font-family: 'Instrument Sans'; src: url('/assets/404/instrument-sans.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }
  html, body { margin: 0; height: 100%; background: #F6F3EC; color: #111; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem;
         font-family: 'Instrument Sans', system-ui, sans-serif; }
  svg { display: block; width: min(100vw, 1100px); height: auto; }
  .gone { visibility: hidden; }
  p { margin: 0 0 2rem; font-size: 1.0625rem; }
  a { color: inherit; text-underline-offset: .2em; }
</style>
</head>
<body>
<main>
  <svg id="art" viewBox="0 0 1672 941" role="img" aria-label="404: Rachel sketching at her drafting table">
    <path id="numeral" fill="#000"/>
    <image id="figure" href="/assets/404/figure.webp"/>
    <g id="arms"></g>
    <image id="blink" class="gone" href="/assets/404/blink.webp"/>
  </svg>
</main>
<p>This page doesn't exist. <a href="/">Back to the start</a></p>
<script>
(async () => {
  const base = '/assets/404/';
  const [m, r] = await Promise.all([fetch(base + '404.json').then(x => x.json()), fetch(base + 'routine.json').then(x => x.json())]);
  const svg = document.getElementById('art');
  const place = (el, o) => { for (const k of ['x', 'y', 'width', 'height']) el.setAttribute(k, o[k === 'width' ? 'w' : k === 'height' ? 'h' : k]); };
  document.getElementById('numeral').setAttribute('d', m.numeral.d);
  place(document.getElementById('figure'), m.figure);
  const blink = document.getElementById('blink'); place(blink, m.blink);
  const arms = {};
  for (const [name, src] of Object.entries(m.arm.frames)) {
    const im = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    im.setAttribute('href', base + src); place(im, m.arm);
    if (name !== m.arm.rest) im.classList.add('gone');
    document.getElementById('arms').append(im); arms[name] = im;
  }
  const phone = matchMedia('(max-aspect-ratio: 1/1)');
  const fit = () => svg.setAttribute('viewBox', phone.matches ? m.phone_viewbox.join(' ') : `0 0 ${m.canvas.w} ${m.canvas.h}`);
  fit(); phone.addEventListener('change', fit);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  // wait until every frame is decoded, so no swap ever shows a blank
  await Promise.all(Object.values(m.arm.frames).concat(m.blink.src, m.figure.src).map(s => { const i = new Image(); i.src = base + s; return i.decode().catch(() => {}); }));
  let cur = m.arm.rest;
  const show = n => { if (n !== cur) { arms[n].classList.remove('gone'); arms[cur].classList.add('gone'); cur = n; } };
  const wait = ms => new Promise(res => setTimeout(res, ms));
  for (;;) {
    for (const s of r.steps) {
      if (document.hidden) { await wait(500); continue; }
      show(s.arm);
      if (s.blink) {
        const pre = (s.ms - r.blink_ms) / 2;
        await wait(pre); blink.classList.remove('gone'); await wait(r.blink_ms); blink.classList.add('gone'); await wait(s.ms - pre - r.blink_ms);
      } else await wait(s.ms);
    }
  }
})();
</script>
</body>
</html>
